name: team-checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install duckdb pandas
      - name: Lint task backlog
        run: python3 team/scripts/validate_tasks.py team/tasks.json
      - name: Provenance (if enabled in team/config.json)
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('team/config.json'))['provenance']['enabled'] else 1)"; then
            python3 team/scripts/check_provenance.py
          else
            echo "provenance check disabled"
          fi
      - name: Definition-of-done checks (full suite)
        run: python3 team/scripts/check.py
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: team/logs/checks/

